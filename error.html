<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連結失效</title>
</head>
<body style="
    margin: 0;
    padding: 0;
    background-color: #F5F3F0;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    line-height: 2;
    color: #4A4A4A;
">
    <div style="
        max-width: 680px;
        margin: 0 auto;
        padding: 80px 40px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    ">
        <h1 style="
            font-size: 24px;
            font-weight: 500;
            color: #333;
            margin: 0 0 60px 0;
            letter-spacing: 0.05em;
        ">抱歉，這個連結似乎失效了</h1>

        <p style="margin: 0 0 32px 0;">很遺憾，我們無法載入這篇內容。</p>

        <p style="margin: 0 0 32px 0;">這可能是因為：</p>

        <p style="margin: 0 0 32px 0; padding-left: 20px;">
            原始網站的連結已經失效<br>
            內容已被移除或搬移<br>
            或是網路連線暫時不穩定
        </p>

        <p style="margin: 0 0 32px 0; padding-top: 20px; border-top: 1px solid #E0DDD9;">
            建議你可以：
        </p>

        <p style="margin: 0 0 32px 0; padding-left: 20px;">
            返回上一頁重新整理<br>
            或是稍後再試一次
        </p>

        <p style="margin: 60px 0 0 0; color: #999; font-size: 14px;">
            如果問題持續發生，可能是原始來源已經永久移除了這篇內容。
        </p>
    </div>
</body>
</html>
