<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連結失效</title>
</head>
<body style="
    margin: 0;
    padding: 0;
    background-color: #F5F3F0;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    line-height: 2;
    color: #4A4A4A;
">
    <div style="
        max-width: 680px;
        margin: 0 auto;
        padding: 80px 40px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;

    ">
        <h1 style="
            font-size: 24px;
            font-weight: 500;
            color: #333;
            margin: 0 0 60px 0;
            letter-spacing: 0.05em;
        ">這個連結目前無法取得內容</h1>

        <p style="margin: 0 0 32px 0;">
            可能是來源暫時無法連線，或該 RSS 已失效。
        </p>

        <p style="margin: 0 0 32px 0; padding-top: 20px; border-top: 1px solid #E0DDD9;">

        </p>
